<!DOCTYPE html><html><head><meta charset='UTF-8'><title>LATUS V30 50M ONLY</title><script src='https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js'></script><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0e;color:#fff;font-family:monospace}.topbar{position:fixed;top:0;left:0;right:0;height:44px;background:#000;border-bottom:2px solid #ffcc00;display:flex;align-items:center;padding:0 12px;z-index:9999;gap:16px;overflow:auto;font-size:13px}.block{background:#13131a;border:1px solid #222;border-radius:12px;padding:12px;margin-bottom:12px}.block-title{font-size:11px;color:#ffcc00;font-weight:900;margin-bottom:8px;display:flex;justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:56px 12px 12px}.full{grid-column:1/-1}.score{font-size:42px;font-weight:900;padding:18px;border-radius:12px;text-align:center}.badge{padding:3px 7px;border-radius:6px;font-size:10px;font-weight:800;border:1px solid}.g{color:#00ff88;border-color:#00ff88}.r{color:#ff3333;border-color:#ff3333}.whale{border-left:5px solid #ff3333;background:#2a0000;padding:10px;margin-bottom:8px;border-radius:8px;font-size:12px;border:1px solid #ff3333}table{width:100%;border-collapse:collapse;font-size:11px}th{color:#666;text-align:left;padding:5px}td{padding:5px;border-top:1px solid #222}.btn{display:block;background:#ffcc00;color:#000;text-align:center;padding:12px;border-radius:8px;font-weight:900;text-decoration:none;margin-top:8px}</style></head><body><div class='topbar' id='topbar'>LATUS V30 - WHALE $50M ONLY</div><div class='grid'><div class='block full' style='border:3px solid #ffcc00'><div class='block-title'>ROBO - SOMENTE ALTA 75%+ <span id='botTime'></span> <span class='badge g' id='winrate'>WINRATE --</span></div><div class='score' id='scoreBox'>AGUARDANDO...</div><div style='margin-top:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:10px' id='checks'></div><div id='motivos'></div><div style='display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px'><div style='background:#0f2318;border:1px solid #00ff88;border-radius:8px;padding:12px'><div style='color:#00ff88;font-weight:900'>ENTRADA PRINCIPAL</div><div id='entradaPrincipal'>ESPERA</div><div id='alvoPrincipal'></div></div><div style='background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:12px'><div style='color:#666;font-weight:900'>ULTIMO SINAL ALTA</div><div id='ultimoSinal'>Nenhum ainda</div></div></div></div><div class='block full'><div class='block-title'>BTCUSDT <span class='badge g' id='chartStatus'>LIVE</span></div><div id='tvchart' style='height:400px'></div></div><div class='block'><div class='block-title'>FILTROS ALTA PRECISAO</div><table><tr><td>LS Ratio</td><td id='ls'>-</td><td id='lsCheck'>-</td></tr><tr><td>Top Pos</td><td id='topPos'>-</td><td id='topCheck'>-</td></tr><tr><td>Funding</td><td id='funding'>-</td><td id='fundCheck'>-</td></tr><tr><td>RSI 15m</td><td id='rsi'>-</td><td id='rsiCheck'>-</td></tr><tr><td>Whale >$50M</td><td id='whaleCheck'>-</td><td id='whaleStatus'>-</td></tr></table></div><div class='block' style='border:2px solid #ff3333'><div class='block-title'>🚨 WHALE ALERT SOMENTE >$50M <span class='badge r'>CRITICO</span></div><div id='whales'>Monitorando... So >$50M</div></div></div><script>let priceNow=84800,lastWhale50Time=0,lastHighSignal=null,candleSeries,chart,klinesData=[];function initChart(){chart=LightweightCharts.createChart(document.getElementById('tvchart'),{layout:{background:{color:'#13131a'},textColor:'#aaa'},grid:{vertLines:{color:'#1a1a1a'},horzLines:{color:'#1a1a1a'}},width:document.getElementById('tvchart').clientWidth,height:400});candleSeries=chart.addCandlestickSeries({upColor:'#00ff88',downColor:'#ff3333',borderVisible:false,wickUpColor:'#00ff88',wickDownColor:'#ff3333'});}async function loadChart(){let kl=await fetch('https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=15m&limit=200').then(r=>r.json());klinesData=kl.map(k=>({time:k[0]/1000,open:parseFloat(k[1]),high:parseFloat(k[2]),low:parseFloat(k[3]),close:parseFloat(k[4])}));candleSeries.setData(klinesData);}async function updateTick(){let t=await fetch('https://data-api.binance.vision/api/v3/ticker/price?symbol=BTCUSDT').then(r=>r.json());priceNow=parseFloat(t.price);if(klinesData.length>0){let last=klinesData[klinesData.length-1];last.close=priceNow;if(priceNow>last.high)last.high=priceNow;if(priceNow<last.low)last.low=priceNow;candleSeries.update(last);}}async function fetchHigh(){let lsJ=await fetch('https://fapi.binance.com/futures/data/globalLongShortAccountRatio?symbol=BTCUSDT&period=5m&limit=1').then(r=>r.json());let lsVal=parseFloat(lsJ[0].longShortRatio);let topJ=await fetch('https://fapi.binance.com/futures/data/topLongShortPositionRatio?symbol=BTCUSDT&period=5m&limit=1').then(r=>r.json());let topVal=parseFloat(topJ[0].longShortRatio);let fundJ=await fetch('https://fapi.binance.com/fapi/v1/premiumIndex?symbol=BTCUSDT').then(r=>r.json());let funding=parseFloat(fundJ.lastFundingRate)*100;let kl=await fetch('https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=15m&limit=100').then(r=>r.json());let closes=kl.map(k=>parseFloat(k[4]));let gains=[],losses=[];for(let i=1;i<15;i++){let d=closes[closes.length-i]-closes[closes.length-i-1];if(d>0)gains.push(d);else losses.push(Math.abs(d));}let avgG=gains.reduce((a,b)=>a+b,0)/(gains.length||1);let avgL=losses.reduce((a,b)=>a+b,0)/(losses.length||1);let rs=avgG/(avgL+0.0001);let rsi=100-(100/(1+rs));let lsPassLong=lsVal>=0.9&&lsVal<=1.30;let lsPassShort=lsVal>=1.70;let topPassLong=topVal>1.80;let whaleBlocked=(Date.now()-lastWhale50Time)<1800000;document.getElementById('ls').innerText=lsVal.toFixed(4);document.getElementById('topPos').innerText=topVal.toFixed(4);document.getElementById('funding').innerText=funding.toFixed(4)+'%';document.getElementById('rsi').innerText=rsi.toFixed(1);document.getElementById('whaleCheck').innerText=whaleBlocked?'BLOQUEADO':'LIBERADO';let score=0;if(lsPassLong)score+=2;if(lsPassShort)score-=2;if(topPassLong)score+=1.5;if(rsi>=32&&rsi<=52)score+=1.5;if(whaleBlocked)score=0;let winrate=Math.abs(score)>=4.5?82:Math.abs(score)>=3.5?76:68;document.getElementById('winrate').innerText='WINRATE '+winrate+'%';let box=document.getElementById('scoreBox');if(whaleBlocked){box.innerHTML='⛔ BLOQUEADO BALEIA >$50M';}else if(score>=3.5){box.style.background='#002a1a';box.style.color='#00ff88';box.innerHTML='🚀 COMPRA ALTA '+winrate+'% $'+priceNow.toFixed(0);}else if(score<=-3.5){box.innerHTML='💥 VENDA ALTA '+winrate+'% $'+priceNow.toFixed(0);}else{box.innerHTML='⏳ ESPERA - SCORE '+score.toFixed(1)+' BTC $'+priceNow.toFixed(0);}document.getElementById('topbar').innerHTML='BTC $'+priceNow.toFixed(0)+' LS '+lsVal.toFixed(2)+' TOP '+topVal.toFixed(2)+' '+(Math.abs(score)>=3.5?winrate+'%':'ESPERA');}async function fetchWhales(){try{let data=await fetch('https://blockchain.info/unconfirmed-transactions?format=json').then(r=>r.json());let txs=data.txs.slice(0,150);let html='';let found=0;txs.forEach(tx=>{let btc=tx.out.reduce((s,o)=>s+o.value,0)/1e8;let usd=btc*priceNow;if(usd>=50000000){found++;lastWhale50Time=Date.now();html+='<div class=whale><b>🚨 $'+(usd/1e6).toFixed(1)+'M ('+btc.toFixed(1)+' BTC) >$50M</b> -> BINANCE DESPEJO<br><span>'+new Date(tx.time*1000).toLocaleTimeString()+' | <a href=https://mempool.space/tx/'+tx.hash+' target=_blank style=color:#00ff88>Rastrear trilha</a></span></div>';}});if(found==0){html='<div style=color:#00ff88;padding:14px;background:#0a2a1e;border-radius:8px;text-align:center'>✅ NENHUMA BALEIA >$50M<br><span style=font-size:10px>So mostra acima de $50M - $10M ignorado - Robo liberado</span></div>';}else{html='<div style=background:#ff3333;color:white;padding:10px;border-radius:8px;margin-bottom:10px;font-weight:900;text-align:center>🚨 '+found+' BALEIA(S) >$50M - ROBO BLOQUEADO</div>'+html;}document.getElementById('whales').innerHTML=html;document.getElementById('whaleStatus').innerText=found>0?found+' >$50M 🔴':'NENHUMA >$50M 🟢';}catch{}}initChart();loadChart();fetchHigh();fetchWhales();setInterval(loadChart,15000);setInterval(updateTick,3000);setInterval(fetchHigh,5000);setInterval(fetchWhales,20000);</script></body></html>
